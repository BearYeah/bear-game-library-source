name: 问题反馈
description: 使用脱敏步骤报告一个具体问题
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿粘贴令牌、密钥、私人地址或个人 data。
  - type: input
    id: version
    attributes:
      label: 版本与系统
      placeholder: 源码版本 / Windows 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤、实际结果与预期结果
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 已尝试的排查与脱敏补充信息
